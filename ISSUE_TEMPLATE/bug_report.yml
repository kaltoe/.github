name: 버그 리포트 (Bug Report)
description: 예상과 다르게 동작하는 문제를 알려주세요.
title: "[BUG] "
labels: [bug]
assignees: []

body:
  - type: dropdown
    id: layer
    attributes:
      label: 🗂️ 발생 레이어
      options:
        - Web (프론트엔드)
        - API (FastAPI / Python)
        - 실시간 (WebSocket)
        - STT / 화자 분리
        - AI (사담 판단 / 요약)
        - DB
        - CI / 배포
        - 전체 연동 (E2E)
        - 모름
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: 🧩 관련 기능
      options:
        - 회의 셋업 (생성 / 안건)
        - 초대 / 입장
        - 라이브 (타이머 / 안건 전환)
        - 실시간 자막
        - 사담 경고
        - 회의 종료 / 요약 / 회의록
        - 공유 링크
        - 기타 / 해당 없음
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 🐞 버그 설명
      description: 어떤 문제가 생겼는지 한두 문장으로 적어주세요.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 📍 재현 방법
      placeholder: |
        1. 회의를 만들고 안건 3개를 등록한다
        2. 참여자 기기 2대로 입장한다
        3. 진행자가 [다음 안건]을 누른다
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 🖥️ 기대 동작과 실제 동작
      placeholder: |
        기대: 두 기기 모두 다음 안건 타이머로 바뀐다
        실제: 참여자 기기는 이전 안건 타이머가 계속 돈다
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🧪 실행 환경
      description: 브라우저, 기기, 실행 환경(로컬/배포), 브랜치나 커밋을 적어주세요.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 🪵 에러 로그 / 응답
      description: 민감정보(API 키, 토큰, 회의 내용)는 지우고 붙여주세요.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📸 스크린샷
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 💬 추가 내용
    validations:
      required: false
